server {
  listen 80;
  root /usr/share/nginx/html;

  # файлы до 5 × 10 МБ за один запрос
  client_max_body_size 60m;

  # Запросы к API передаём контейнеру api (имя сервиса из docker-compose)
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    # настоящий IP клиента — API использует его для лимитов на вход и в логах
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: на любой адрес (/tasks/5 и т.п.) отдаём index.html, дальше разбирается React Router
  location / {
    try_files $uri /index.html;
  }
}
