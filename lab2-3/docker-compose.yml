# Своё имя проекта, чтобы контейнеры и тома не пересекались с другими лабами
name: spp-lab2

services:
  db:
    image: postgres:16-alpine
    container_name: spp_lab2_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports:
      - "5434:5432" # только для локальной разработки (npm run dev); 5432/5433 уже заняты
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Тестовый почтовый сервер: принимает письма по SMTP и показывает их в веб-интерфейсе
  mailpit:
    image: axllent/mailpit:latest
    container_name: spp_lab2_mail
    ports:
      - "8025:8025" # веб-интерфейс с письмами: http://localhost:8025

  api:
    build: ./server
    container_name: spp_lab2_api
    environment:
      DATABASE_URL: postgres://app:app@db:5432/tasks
      MAX_FILE_SIZE_MB: 10
      JWT_SECRET: ${JWT_SECRET:-spp-lab3-dev-secret-change-me} # ключ подписи токенов
      APP_URL: http://localhost:8080 # адрес клиента для ссылок в письмах
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      LOG_LEVEL: info
      SEED_DEMO_USERS: "true" # демо-пользователи admin / manager / user
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./client
    container_name: spp_lab2_web
    ports:
      - "8080:80" # приложение: http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
