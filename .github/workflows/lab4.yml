# Автоматическая проверка лабораторной 4 при каждом push и pull request
name: lab4 CI

on:
  workflow_dispatch: # кнопка «Run workflow» — ручной запуск
  push:
    paths: ['lab4/**', '.github/workflows/lab4.yml']
  pull_request:
    paths: ['lab4/**', '.github/workflows/lab4.yml']

jobs:
  test:
    name: Линтер и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab4
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: game_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d game_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/game_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab4/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        working-directory: lab4
